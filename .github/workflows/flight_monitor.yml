name: Flight Monitor SCL-COR

on:
  schedule:
    # 4 veces al día (UTC). 
    # 08:00, 14:00, 20:00, 02:00 (Hora Chile aprox)
    - cron: '0 5,11,17,23 * * *'
  workflow_dispatch: 

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11' # Versión más moderna y estable
          cache: 'pip' # Acelera las ejecuciones futuras

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright requests playwright-stealth
          python -m playwright install --with-deps chromium

      - name: Run Monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONUNBUFFERED: "1" # Asegura que los logs se vean en tiempo real
        run: python flight_monitor.py
